{% extends "challenge.html" %}

{% block description %}
{{ challenge.html }}

<div class="row text-center my-3">
    <div id="dehliz-panel" class="col-12">
        <!-- 1. Durdurulmuş / Başlatılmamış Durum -->
        <div id="dehliz-panel-stopped" class="card shadow-sm border-0 bg-light">
            <div class="card-body py-4">
                <h5 class="card-title font-weight-bold text-dark">🛡️ Dehliz Siber Tatbikat Sahası</h5>
                <p class="card-text text-muted small mb-3">
                    Bu soruya özel izole bir konteyner ayağa kaldırmak ve tünel üzerinden erişmek için butona tıklayın.
                </p>
                <button class="btn btn-primary btn-md font-weight-bold shadow-sm px-4" id="dehliz-btn-boot" type="button" onclick="dehlizBoot()">
                    🚀 Özel Soru Labını Başlat
                </button>
            </div>
        </div>

        <!-- 2. Çalışıyor Durumu -->
        <div id="dehliz-panel-started" class="card shadow-sm border-0 border-success" style="display: none;">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-2">
                <span class="font-weight-bold small">🛡️ Canlı Lab Hedefi</span>
                <span class="badge bg-warning badge-warning text-dark font-weight-bold px-2 py-1" style="background-color: #ffc107 !important; color: #212529 !important;">
                    ⏳ Kalan Süre: <span id="dehliz-countdown">--:--</span>
                </span>
            </div>
            <div class="card-body text-center py-3">
                <div id="dehliz-user-access" class="mb-3"></div>

                <div class="small text-muted mb-3">
                    Alan Adı: <code id="dehliz-lan-domain" class="text-primary font-weight-bold"></code>
                </div>

                <div class="btn-group shadow-sm">
                    <button type="button" class="btn btn-success btn-sm font-weight-bold" id="dehliz-btn-renew" onclick="dehlizRenew()">
                        🔄 Süreyi Uzat (+30 dk)
                    </button>
                    <button type="button" class="btn btn-danger btn-sm font-weight-bold" id="dehliz-btn-destroy" onclick="dehlizDestroy()">
                        ⏹️ Labı Kapat
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
