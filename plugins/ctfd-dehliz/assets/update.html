{% extends "admin/challenges/update.html" %}

{% block value %}
<div class="form-group">
    <label for="value">Mevcut Puan<br>
        <small class="form-text text-muted">Sorunun şu anki puanı</small>
    </label>
    <input type="number" class="form-control chal-value" name="value" value="{{ challenge.value }}" disabled>
</div>

<div class="form-group">
    <label for="initial">Başlangıç Puanı<br>
        <small class="form-text text-muted">Sorunun ilk puanı</small>
    </label>
    <input type="number" class="form-control chal-initial" name="initial" value="{{ challenge.initial }}" required>
</div>

<div class="form-group">
    <label for="decay">Düşüş Limiti (Decay)<br>
        <small class="form-text text-muted">Puanın tabana ineceği çözüm sayısı</small>
    </label>
    <input type="number" class="form-control chal-decay" name="decay" value="{{ challenge.decay }}" required>
</div>

<div class="form-group">
    <label for="minimum">Taban Puan<br>
        <small class="form-text text-muted">İnebileceği minimum puan</small>
    </label>
    <input type="number" class="form-control chal-minimum" name="minimum" value="{{ challenge.minimum }}" required>
</div>

<hr>

<div class="form-group">
    <label for="docker_image">Docker İmajı<br>
        <small class="form-text text-muted">Konteyner imaj adı</small>
    </label>
    <input type="text" class="form-control" name="docker_image" value="{{ challenge.docker_image }}" required>
</div>

<div class="form-group">
    <label for="container_port">Hedef Konteyner Portu<br>
        <small class="form-text text-muted">Dinlenen iç port</small>
    </label>
    <input type="number" class="form-control" name="container_port" value="{{ challenge.container_port }}" required>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="form-group">
            <label for="memory_limit">RAM Sınırı<br>
                <small class="form-text text-muted">Maksimum bellek</small>
            </label>
            <input type="text" class="form-control" name="memory_limit" value="{{ challenge.memory_limit }}" required>
        </div>
    </div>
    <div class="col-md-6">
        <div class="form-group">
            <label for="cpu_limit">CPU Sınırı<br>
                <small class="form-text text-muted">CPU payı</small>
            </label>
            <input type="number" step="0.1" class="form-control" name="cpu_limit" value="{{ challenge.cpu_limit }}" required>
        </div>
    </div>
</div>

<div class="form-group">
    <label for="dynamic_score">Puanlama Modeli<br></label>
    <select class="form-control" name="dynamic_score">
        <option value="1" {% if challenge.dynamic_score %}selected{% endif %}>Dinamik Puanlama</option>
        <option value="0" {% if not challenge.dynamic_score %}selected{% endif %}>Sabit Puanlama</option>
    </select>
</div>
{% endblock %}
